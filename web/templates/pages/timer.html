{{define "content"}}
<div class="timer-container">
    <h2>Pomodoro</h2>
    <nav>
        <ul id="tabs">
            <li name="Pomodoro" class="is-active">Pomodoro</li>
            <li name="Short Break">Short Break</li>
            <li name="Long Break">Long Break</li>
        </ul>
    </nav>
    <div class="timer-display" id="timerDisplay">
        <span id="minutes">05</span>:<span id="seconds">00</span>
    </div>
    <div class="timer-controls">
        <button onclick="startTimer()">▶ Старт</button>
        <button onclick="pauseTimer()">⏸ Пауза</button>
        <button onclick="resetTimer()">⟳ Сброс</button>
    </div>
    <div class="progress-bar">
        <div id="progressBar" class="progress-fill"></div>
    </div>
    <p id="statusMessage">Готов к запуску</p>
</div>
{{end}}

{{define "scripts_extra"}}
<script>
    let tab = "Pomodoro"

    let INITIAL_DURATION = tab == "Pomodoro" ? {{.WorkDuration}} * 60 : tab == "Short Break" ? {{.BreakDuration}} * 60 : {{.LongBreakDuration}} * 60 
    let timeLeft = INITIAL_DURATION
    let timerInterval = null
    let isRunning = false
    let endTime = null

    const items = document.querySelectorAll('li')
    items.forEach(item => {
        item.addEventListener('click', () => {
            items.forEach( el => el.classList.remove('is-active'))

            item.classList.add('is-active')
        })
    })

    document.getElementById("tabs").addEventListener('click', (event) => {
        li = event.target.closest('li')
        tab = li.getAttribute("name")

        console.log(tab);
        INITIAL_DURATION = tab == "Pomodoro" ? {{.WorkDuration}} * 60 : tab == "Short Break" ? {{.BreakDuration}} * 60 : {{.LongBreakDuration}} * 60
        timeLeft = INITIAL_DURATION
        updateDisplay()
    })

    document.querySelector('button[type="submit"]').addEventListener('click', (event) => {
        updateDisplay()
    })

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60)
        const seconds = timeLeft % 60

        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0')
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0')

        const progress = ((INITIAL_DURATION - timeLeft) / INITIAL_DURATION) * 100
        document.getElementById('progressBar').style.width = progress + '%'

        if (timeLeft < 10) {
            document.querySelector('.timer-display').style.color = 'red'
            document.querySelector('.timer-display').style.animation = 'blink 0.5s infinite'
        } else {
            document.querySelector('.timer-display').style.color = '#333'
            document.querySelector('.timer-display').style.animation = 'none'
        }
    }

    function tick() {
        if (timeLeft <= 0) {
            clearInterval(timerInterval)
            timerInterval = null
            isRunning = false
            document.getElementById('statusMessage').textContent = '⏰ Время вышло!'
            document.getElementById('statusMessage').style.color = 'red'
            return
        }

        timeLeft--
        updateDisplay()
    }

    function startTimer() {
        if (isRunning) return
        if (timeLeft <= 0) {
            resetTimer()
        }

        isRunning = true
        document.getElementById('statusMessage').textContent = '⏱ Таймер запущен'
        document.getElementById('statusMessage').style.color = 'green'

        if (timerInterval) {
            clearInterval(timerInterval)
        }
        timerInterval = setInterval(tick, 1000)
    }

    function pauseTimer() {
        if (!isRunning) return
        isRunning = false
        clearInterval(timerInterval)
        timerInterval = null
        document.getElementById('statusMessage').textContent = '⏸ На паузе'
        document.getElementById('statusMessage').style.color = 'orange'
    }

    function resetTimer() {
        clearInterval(timerInterval)
        timerInterval = null
        isRunning = false
        timeLeft = INITIAL_DURATION
        updateDisplay()
        document.getElementById('statusMessage').textContent = '🔄 Сброшен'
        document.getElementById('statusMessage').style.color = 'blue'
        document.querySelector('.timer-display').style.color = '#333'
    }

    document.addEventListener('DOMContentLoaded', function () {
        updateDisplay()
        document.getElementById('statusMessage').textContent = '✅ Готов к запуску'
        document.getElementById('statusMessage').style.color = '#333'
    })
</script>
{{end}}
